name: Publish Workflow

on:
  release:
    types:
      - published

# The release that was just cut gets the integration zip it needs. Each step
# stops at its first failure, so a broken build or upload is visible in the
# run log rather than only as a failed job.

# There is no permissions block here on purpose: `releases` is not a key the
# workflow schema accepts, and an invalid file made the job never start. The
# release access comes from the repository token instead.

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Find the integration
        id: information
        shell: bash
        run: |
          set -euo pipefail
          count=$(find custom_components -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one integration directory, found $count"
            exit 1
          fi
          find custom_components -mindepth 1 -maxdepth 1 -type d -printf "name=%f\n" >> "$GITHUB_OUTPUT"
      - name: Stamp the manifest with the release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          manifest="custom_components/${{ steps.information.outputs.name }}/manifest.json"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" "$manifest"
          grep -q "\"version\": \"$version\"" "$manifest"
      - name: Create zip file for the integration
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.information.outputs.name }}"
          cd "custom_components/${name}"
          rm -f "${name}.zip"
          zip -r -X "${name}.zip" .
          test -f "${name}.zip"
      - name: Upload the zipfile as a release asset
        shell: bash
        env:
          GH_TOKEN: ${GITHUB_TOKEN}
        run: |
          set -euo pipefail
          name="${{ steps.information.outputs.name }}"
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" "custom_components/${name}/${name}.zip" --clobber
