name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group lint
      - run: uv run ruff check custom_components/neakasa/ tests/
      - run: uv run ruff format --check custom_components/neakasa/ tests/

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group lint --group dev
      - run: uv run mypy --no-site-packages custom_components/neakasa/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    needs: [ruff, mypy]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest --cov-fail-under=90 -v

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration